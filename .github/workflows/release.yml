name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PACKER_VERSION: "0.2.49"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 驗證 tag 與 version.txt 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content version.txt -TotalCount 1).Trim()
          if ($v -ne '${{ github.ref_name }}') {
            Write-Error "version.txt（$v）與 tag（${{ github.ref_name }}）不一致"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - name: 测试 Python
        run: python -m unittest discover -s tests -v

      - name: 下载并校验上游原版核心
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ env.PACKER_VERSION }}" --repo Montaro2017/bili_novel_packer --pattern '*x86_64-windows.exe' --dir tools
          $hash = (Get-FileHash "tools/bili_novel_packer-${{ env.PACKER_VERSION }}-x86_64-windows.exe" -Algorithm SHA256).Hash
          if ($hash -ne 'c78c4dc58ba88610c65dcd44c817e3d93b783296340c1b847835acf8e56bb4a3') { throw '核心校验失败' }

      - name: 建置與打包
        run: ./packaging/build_release.ps1

      - name: 取得產物名稱
        id: out
        run: |
          $v = (Get-Content version.txt -TotalCount 1).Trim()
          "zip=BiliNovelDownloader-$v-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: 上傳測試 artifact（非 tag 觸發）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: ${{ steps.out.outputs.zip }}

      - name: 建立 draft release（tag 觸發）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.out.outputs.zip }}" `
            --draft --title "${{ github.ref_name }}" `
            --notes "简体界面、GUI 代理设置和交互适配。包含上游原版核心 v${{ env.PACKER_VERSION }}，请整包更新。"
