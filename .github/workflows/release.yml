name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PACKER_VERSION: "0.2.49-gui"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 驗證 tag 與 version.txt 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content version.txt -TotalCount 1).Trim()
          if ($v -ne '${{ github.ref_name }}') {
            Write-Error "version.txt（$v）與 tag（${{ github.ref_name }}）不一致"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.21.0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'

      - name: 测试 Python
        run: python -m unittest discover -s tests -v

      - name: 构建配套核心
        run: |
          Push-Location vendor/packer
          dart pub get --enforce-lockfile
          dart analyze bin/gui.dart lib/gui_proxy.dart
          dart test test/gui_proxy_test.dart
          dart compile exe bin/gui.dart -o ../../tools/bili_novel_packer-0.2.49-gui.exe
          Pop-Location

      - name: 建置與打包
        run: ./packaging/build_release.ps1

      - name: 取得產物名稱
        id: out
        run: |
          $v = (Get-Content version.txt -TotalCount 1).Trim()
          "zip=BiliNovelDownloader-$v-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: 上傳測試 artifact（非 tag 觸發）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: ${{ steps.out.outputs.zip }}

      - name: 建立 draft release（tag 觸發）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.out.outputs.zip }}" `
            --draft --title "${{ github.ref_name }}" `
            --notes "简体界面、HTTP 代理和单次任务退出修复。包含配套核心 v${{ env.PACKER_VERSION }}，请整包更新。"
